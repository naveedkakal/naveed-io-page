<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c12"/><stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#20242e" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#5bc8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5bc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#ff6b81" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff6b81" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- kicker -->
    <text x="80" y="118" fill="#5bc8ff" font-size="21" font-weight="600" letter-spacing="4.4">§ INTERNET FOLKLORE · RETOLD</text>

    <!-- title -->
    <text x="76" y="264" fill="#eef0f4" font-size="132" font-weight="700" letter-spacing="-5">The Liam</text>
    <text x="76" y="392" fill="none" stroke="#ff6b81" stroke-width="2" font-size="132" font-weight="700" letter-spacing="-5">Incident</text>

    <!-- rule -->
    <rect x="80" y="440" width="1040" height="1" fill="#2b303c"/>

    <!-- standfirst -->
    <text x="80" y="492" fill="#a2a8b4" font-size="28" font-weight="400">Three months. Every single date. One friend who would not leave —</text>
    <text x="80" y="532" fill="#a2a8b4" font-size="28" font-weight="400">and a tragic backstory that turned out to be entirely invented.</text>

    <!-- footer chips -->
    <g>
      <rect x="80" y="566" width="196" height="38" rx="19" fill="#101319" stroke="#2b303c"/>
      <text x="102" y="591" fill="#a2a8b4" font-size="18" letter-spacing="1.6">naveed.io/liam</text>

      <rect x="290" y="566" width="238" height="38" rx="19" fill="#1a0f14" stroke="#5a2b36"/>
      <text x="312" y="591" fill="#ff6b81" font-size="18" letter-spacing="1.6">MOOD: BAFFLING</text>
    </g>
  </g>
</svg>
